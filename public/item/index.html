<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작품 상세 | 바이브코딩 공부</title><link rel="stylesheet" href="/auth.css"><script src="/supabase-config.js"></script><script src="/auth.js"></script><style>
:root{--bg:#fff8ee;--ink:#3d2921;--muted:#806b61;--brand:#b64f32;--line:#ead4c2;--card:#fffdf9}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:var(--bg);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}nav,main{width:min(100% - 36px,920px);margin:auto}nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.back{color:var(--brand);font-weight:750;text-decoration:none}.panel{padding:clamp(20px,5vw,46px);border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 12px 40px #74412a12}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px;background:#f6dec1}h1{margin:24px 0 10px;font-size:clamp(32px,6vw,52px);letter-spacing:-.04em}.summary,.meta{color:var(--muted);line-height:1.7}.creator{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:24px 0;padding:16px;border-radius:16px;background:#fff3e6}.actions{display:flex;gap:10px;margin:22px 0}.button{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:inherit;font-weight:750;cursor:pointer}.button.active,.button.primary{border-color:var(--brand);background:var(--brand);color:white}.description{white-space:pre-wrap;line-height:1.8}.comments{margin-top:34px}.comment-form{display:flex;gap:10px}.comment-form textarea{min-height:90px;flex:1;padding:14px;border:1px solid var(--line);border-radius:14px;font:inherit;resize:vertical}.comment{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:white}.comment-head{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.comment p{margin:10px 0 0;white-space:pre-wrap;line-height:1.6}.message{margin:16px 0;color:var(--brand);font-weight:650}.hidden{display:none}@media(max-width:640px){.comment-form{flex-direction:column}.button{width:100%}}
</style></head><body><nav><a class="back" href="/list/">← 작품 목록</a><div class="auth-nav" data-auth-nav></div></nav><main><div id="loading" class="panel">작품을 불러오는 중이에요…</div><section id="content" class="panel hidden"><img id="cover" class="cover" src="/og.png" alt=""><h1 id="title"></h1><p id="summary" class="summary"></p><div id="meta" class="meta"></div><div class="creator"><div><small>만든 사람</small><strong id="creator-name" style="display:block;margin-top:4px">회원</strong></div><button id="follow" class="button hidden" type="button">팔로우</button></div><div class="actions"><button id="like" class="button" type="button">♡ 좋아요 <span id="like-count">0</span></button><a id="project-link" class="button primary" target="_blank" rel="noopener noreferrer" style="display:grid;place-items:center;text-decoration:none">작품 사이트 열기 ↗</a></div><div id="description" class="description"></div><section class="comments"><h2>댓글 <span id="comment-count">0</span></h2><p id="message" class="message" role="alert"></p><form id="comment-form" class="comment-form"><textarea id="comment-body" maxlength="500" placeholder="따뜻한 댓글을 남겨주세요" aria-label="댓글 내용"></textarea><button class="button primary" type="submit">댓글 등록</button></form><div id="comment-list"></div></section></section></main><script>
const config=window.__SUPABASE_CONFIG__||{};const params=new URLSearchParams(location.search);const itemId=params.get('id');const loading=document.querySelector('#loading');const content=document.querySelector('#content');const message=document.querySelector('#message');let session=null,item=null,liked=false,followed=false;
const headers=(auth=false)=>({apikey:config.anonKey,Authorization:`Bearer ${auth&&session?session.access_token:config.anonKey}`,'Content-Type':'application/json'});const esc=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const api=async(path,options={})=>{const r=await fetch(`${config.url}/rest/v1/${path}`,{...options,headers:{...headers(options.auth),...(options.headers||{})}});const data=await r.json().catch(()=>null);if(!r.ok)throw new Error(data?.message||'요청을 처리하지 못했어요.');return data};const needLogin=()=>{location.href=`/login?next=${encodeURIComponent(location.pathname+location.search)}`};
async function load(){if(!itemId||!config.url){loading.textContent='잘못된 작품 주소예요.';return}session=await VibeAuth.getSession();const rows=await api(`items?id=eq.${encodeURIComponent(itemId)}&select=*`);if(!rows.length){loading.textContent='작품을 찾을 수 없어요.';return}item=rows[0];document.querySelector('#cover').src=item.cover_image_url||'/og.png';document.querySelector('#cover').alt=`${item.title} 대표 이미지`;document.querySelector('#title').textContent=item.title;document.querySelector('#summary').textContent=item.summary;document.querySelector('#meta').textContent=`${item.region||'지역 미정'} · ${new Intl.DateTimeFormat('ko-KR',{dateStyle:'long'}).format(new Date(item.created_at))}`;document.querySelector('#description').textContent=item.description;document.querySelector('#project-link').href=item.project_url;const profiles=item.author_id?await api(`profiles?user_id=eq.${item.author_id}&select=display_name`):[];document.querySelector('#creator-name').textContent=profiles[0]?.display_name||'탈퇴한 회원';const follow=document.querySelector('#follow');if(item.author_id&&session?.user?.id!==item.author_id){follow.classList.remove('hidden');if(session){const f=await api(`follows?follower_id=eq.${session.user.id}&following_id=eq.${item.author_id}&select=follower_id`);followed=!!f.length}paintFollow()}await Promise.all([loadLikes(),loadComments()]);loading.classList.add('hidden');content.classList.remove('hidden')}
async function loadLikes(){const likes=await api(`item_likes?item_id=eq.${itemId}&select=user_id`);document.querySelector('#like-count').textContent=likes.length;liked=!!session&&likes.some(x=>x.user_id===session.user.id);document.querySelector('#like').classList.toggle('active',liked)}async function loadComments(){const comments=await api(`item_comments?item_id=eq.${itemId}&select=id,author_id,body,created_at&order=created_at.asc`);const ids=[...new Set(comments.map(x=>x.author_id))];const profiles=ids.length?await api(`profiles?user_id=in.(${ids.join(',')})&select=user_id,display_name`):[];const names=Object.fromEntries(profiles.map(x=>[x.user_id,x.display_name]));document.querySelector('#comment-count').textContent=comments.length;document.querySelector('#comment-list').innerHTML=comments.length?comments.map(x=>`<article class="comment"><div class="comment-head"><strong>${esc(names[x.author_id]||'회원')}</strong><time>${new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium'}).format(new Date(x.created_at))}</time></div><p>${esc(x.body)}</p></article>`).join(''):'<p class="summary">첫 댓글을 남겨보세요.</p>'}
function paintFollow(){document.querySelector('#follow').textContent=followed?'팔로잉':'팔로우';document.querySelector('#follow').classList.toggle('active',followed)}document.querySelector('#like').onclick=async()=>{if(!session)return needLogin();try{if(liked)await api(`item_likes?item_id=eq.${itemId}&user_id=eq.${session.user.id}`,{method:'DELETE',auth:true});else await api('item_likes',{method:'POST',auth:true,headers:{Prefer:'return=minimal'},body:JSON.stringify({item_id:itemId,user_id:session.user.id})});await loadLikes()}catch(e){message.textContent=e.message}};document.querySelector('#follow').onclick=async()=>{if(!session)return needLogin();try{if(followed)await api(`follows?follower_id=eq.${session.user.id}&following_id=eq.${item.author_id}`,{method:'DELETE',auth:true});else await api('follows',{method:'POST',auth:true,headers:{Prefer:'return=minimal'},body:JSON.stringify({follower_id:session.user.id,following_id:item.author_id})});followed=!followed;paintFollow()}catch(e){message.textContent=e.message}};document.querySelector('#comment-form').onsubmit=async(e)=>{e.preventDefault();if(!session)return needLogin();const body=document.querySelector('#comment-body').value.trim();if(!body){message.textContent='댓글 내용을 입력해 주세요.';return}try{await api('item_comments',{method:'POST',auth:true,headers:{Prefer:'return=minimal'},body:JSON.stringify({item_id:itemId,author_id:session.user.id,body})});document.querySelector('#comment-body').value='';message.textContent='댓글을 등록했어요.';await loadComments()}catch(err){message.textContent=err.message}};load().catch(e=>{loading.textContent=e.message});
</script></body></html>
