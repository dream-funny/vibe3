<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>완성 작품 | 바이브코딩 공부</title>
    <meta name="description" content="함께 만든 바이브코딩 완성 작품을 둘러보세요." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/auth.css" />
    <style>
      :root{--bg:#fff8ee;--ink:#3d2921;--muted:#806b61;--brand:#b64f32;--soft:#f6dec1;--line:#ead4c2;--card:#fffdf9}
      *{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:var(--bg);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif}
      body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none}body:before{width:min(46rem,82vw);height:min(46rem,82vw);top:-26rem;left:-15rem;background:radial-gradient(circle,#e99a705f,transparent 68%)}body:after{width:min(34rem,75vw);height:min(34rem,75vw);top:8rem;right:-17rem;background:radial-gradient(circle,#efc67366,transparent 68%)}
      nav,main{width:min(100% - 40px,1152px);margin-inline:auto}nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:24px}.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:750;text-decoration:none}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;color:white;background:var(--brand)}.nav-actions{display:flex;align-items:center;gap:14px}.new-link{color:var(--brand);font-size:14px;font-weight:750;text-decoration:none}
      main{padding-block:44px 80px}.eyebrow{margin:0 0 12px;color:var(--brand);font-size:14px;font-weight:750}h1{margin:0 0 32px;font-size:clamp(38px,6vw,54px);letter-spacing:-.045em}.filters{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:10px;margin-bottom:28px;padding:14px;border:1px solid var(--line);border-radius:18px;background:#fffdf9d9;box-shadow:0 5px 18px #74412a0d}.filters label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.filters input,.filters select,.clear-button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:inherit}.filters input,.filters select{width:100%;padding:0 14px}.filters input:focus,.filters select:focus{outline:3px solid #b64f3226;border-color:var(--brand)}.clear-button{padding:0 18px;color:var(--brand);font-weight:750;cursor:pointer}.clear-button:disabled{cursor:not-allowed;opacity:.45}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:flex;min-width:0;overflow:hidden;flex-direction:column;border:1px solid var(--line);border-radius:22px;background:#fffdf9d9;box-shadow:0 5px 18px #74412a0d}.cover-link{display:block;color:inherit;text-decoration:none}.cover-wrap{position:relative;display:grid;aspect-ratio:16/10;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--soft),#fff2df)}.cover-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}.cover-link:hover img{transform:scale(1.025)}.cover-fallback{display:none;padding:20px;color:var(--muted);font-size:13px;text-align:center}.cover-wrap.image-error img{display:none}.cover-wrap.image-error .cover-fallback{display:block}.card-body{display:flex;min-height:224px;flex:1;flex-direction:column;padding:22px}h2{margin:0;font-size:20px;letter-spacing:-.02em}.title-link{color:inherit;text-decoration:none}.title-link:hover{text-decoration:underline;text-decoration-color:var(--soft);text-decoration-thickness:4px;text-underline-offset:3px}.summary{display:-webkit-box;overflow:hidden;margin:12px 0;color:var(--muted);font-size:14px;line-height:1.65;-webkit-box-orient:vertical;-webkit-line-clamp:2}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}.tag{padding:5px 9px;border-radius:999px;background:#f8e8d8;color:#8f4935;font-size:12px;font-weight:650}.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:auto;color:var(--muted);font-size:13px}.visit-link{display:flex;align-items:center;justify-content:center;margin-top:18px;padding:11px 14px;border-radius:12px;color:white;background:var(--brand);font-size:14px;font-weight:750;text-decoration:none}.visit-link:hover{background:#963d27}.state{display:flex;min-height:288px;align-items:center;justify-content:center;flex-direction:column;border:1px dashed var(--line);border-radius:24px;background:#fffdf9bf;text-align:center}.state p{margin:8px 0 0;color:var(--muted);font-size:14px}.loader{width:34px;height:34px;margin-bottom:18px;border:3px solid var(--soft);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}.hidden{display:none}@keyframes spin{to{transform:rotate(360deg)}}
      @media(max-width:760px){nav,main{width:min(100% - 32px,1152px)}nav{align-items:flex-start}.brand span:last-child{display:none}.nav-actions{gap:8px}.new-link{white-space:nowrap}main{padding-top:38px}.filters{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:164px}}@media(prefers-reduced-motion:reduce){.loader{animation:none}}
    </style>
    <script src="/supabase-config.js"></script>
  </head>
  <body>
    <nav><a class="brand" href="/"><span class="logo" aria-hidden="true">✦</span><span>바이브코딩 공부</span></a><div class="nav-actions"><a class="new-link" href="/new">올리기</a><div class="auth-nav" data-auth-nav aria-live="polite"></div></div></nav>
    <main>
      <p class="eyebrow">함께 만든 결과물</p><h1>완성 작품</h1>
      <form id="filters" class="filters" role="search"><label for="search">제목 검색</label><input id="search" name="q" type="search" placeholder="작품 제목을 검색해 보세요" autocomplete="off"><label for="region">지역</label><select id="region" name="region"><option value="">모든 지역</option><option>서울</option><option>경기</option><option>인천</option><option>부산</option><option>대구</option><option>광주</option><option>대전</option><option>울산</option><option>세종</option><option>강원</option><option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option><option>온라인</option><option>지역 미정</option></select><button id="clear-filters" class="clear-button" type="button">조건 지우기</button></form>
      <div id="loading" class="state" aria-live="polite"><span class="loader" aria-hidden="true"></span><strong>작품을 불러오는 중이에요</strong></div>
      <div id="empty" class="state hidden"><strong>아직 등록된 글이 없어요</strong><p>첫 번째 바이브코딩 작품을 기다리고 있어요.</p></div>
      <div id="no-results" class="state hidden"><strong>검색 결과가 없어요</strong><p>검색어나 지역 조건을 바꿔보세요.</p></div>
      <div id="error" class="state hidden"><strong>목록을 불러오지 못했어요</strong><p id="error-message">잠시 후 다시 시도해 주세요.</p></div>
      <div id="items" class="grid hidden"></div>
    </main>
    <script src="/auth.js"></script>
    <script>
      const loading=document.querySelector('#loading');const empty=document.querySelector('#empty');const noResults=document.querySelector('#no-results');const error=document.querySelector('#error');const grid=document.querySelector('#items');const search=document.querySelector('#search');const region=document.querySelector('#region');const clearFilters=document.querySelector('#clear-filters');let allItems=[];
      const show=(element)=>{[loading,empty,noResults,error,grid].forEach((item)=>item.classList.add('hidden'));element.classList.remove('hidden')};
      const escapeHtml=(value)=>String(value).replace(/[&<>'"]/g,(character)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
      const safeHttpUrl=(value)=>{try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:''}catch{return ''}};
      const renderTags=(tags)=>{const values=Array.isArray(tags)?tags:String(tags||'').split(',');return values.filter(Boolean).slice(0,5).map((tag)=>`<span class="tag">#${escapeHtml(String(tag).trim())}</span>`).join('')};
      const syncUrl=()=>{const params=new URLSearchParams();if(search.value.trim())params.set('q',search.value.trim());if(region.value)params.set('region',region.value);history.replaceState(null,'',`${location.pathname}${params.size?`?${params}`:''}`);clearFilters.disabled=!params.size};
      const renderItems=()=>{syncUrl();if(!allItems.length){show(empty);return}const keyword=search.value.trim().toLocaleLowerCase('ko-KR');const filtered=allItems.filter((item)=>{const matchesTitle=!keyword||String(item.title).toLocaleLowerCase('ko-KR').includes(keyword);const itemRegion=item.region||'지역 미정';const matchesRegion=!region.value||(region.value==='지역 미정'?itemRegion==='지역 미정':itemRegion.startsWith(region.value));return matchesTitle&&matchesRegion});if(!filtered.length){show(noResults);return}grid.innerHTML=filtered.map((item)=>{const imageUrl=safeHttpUrl(item.cover_image_url);const projectUrl=safeHttpUrl(item.project_url);const image=imageUrl?`<div class="cover-wrap"><img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(item.title)} 대표 이미지" loading="lazy"><span class="cover-fallback">이미지를 불러올 수 없어요</span></div>`:`<div class="cover-wrap image-error"><span class="cover-fallback">등록된 대표 이미지가 없어요</span></div>`;const linkedImage=projectUrl?`<a class="cover-link" href="${escapeHtml(projectUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(item.title)} 작품 열기">${image}</a>`:image;return `<article class="card">${linkedImage}<div class="card-body"><h2>${projectUrl?`<a class="title-link" href="${escapeHtml(projectUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>`:escapeHtml(item.title)}</h2>${item.summary?`<p class="summary">${escapeHtml(item.summary)}</p>`:''}${item.tags?`<div class="tags">${renderTags(item.tags)}</div>`:''}<div class="meta"><span>⌖ ${escapeHtml(item.region||'지역 미정')}</span><time datetime="${escapeHtml(item.created_at)}">▣ ${new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric'}).format(new Date(item.created_at))}</time></div>${projectUrl?`<a class="visit-link" href="${escapeHtml(projectUrl)}" target="_blank" rel="noopener noreferrer">작품 보기 ↗</a>`:'<span class="visit-link" aria-disabled="true">등록된 작품 링크가 없어요</span>'}</div></article>`}).join('');grid.querySelectorAll('.cover-wrap img').forEach((image)=>image.addEventListener('error',()=>image.closest('.cover-wrap').classList.add('image-error')));show(grid)};
      const params=new URLSearchParams(location.search);search.value=params.get('q')||'';region.value=params.get('region')||'';search.addEventListener('input',renderItems);region.addEventListener('change',renderItems);clearFilters.addEventListener('click',()=>{search.value='';region.value='';renderItems();search.focus()});
      async function loadItems(){const config=window.__SUPABASE_CONFIG__||{};if(!config.url||!config.anonKey){document.querySelector('#error-message').textContent='목록 연결 설정이 필요해요.';show(error);return}try{const response=await fetch(`${config.url}/rest/v1/items?select=id,title,region,cover_image_url,summary,tags,project_url,created_at&order=created_at.desc`,{headers:{apikey:config.anonKey,Authorization:`Bearer ${config.anonKey}`}});if(!response.ok)throw new Error();allItems=await response.json();renderItems()}catch{show(error)}}
      loadItems();
    </script>
  </body>
</html>
