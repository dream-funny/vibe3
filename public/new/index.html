<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>작품 등록 | 바이브코딩 공부</title>
    <meta name="description" content="새로운 바이브코딩 완성 작품을 등록하세요." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/auth.css" />
    <link rel="stylesheet" href="/account.css" />
    <script src="/supabase-config.js"></script>
    <script src="/auth.js"></script>
  </head>
  <body>
    <nav><a class="brand" href="/"><span class="logo" aria-hidden="true">✦</span><span>바이브코딩 공부</span></a><div class="auth-nav" data-auth-nav aria-live="polite"></div></nav>
    <main>
      <section id="protected-content" class="panel" aria-labelledby="page-title" hidden>
        <p class="eyebrow">나의 결과물 공유하기</p>
        <h1 id="page-title">새 작품 등록</h1>
        <p class="intro">로그인이 확인됐어요. 작품 등록 양식은 다음 단계에서 이어서 만들 수 있어요.</p>
        <a class="auth-button" href="/list">완성 작품 둘러보기</a>
      </section>
    </main>
    <script>
      VibeAuth.getSession().then((session)=>{if(!session){location.replace('/login?next=%2Fnew');return}document.querySelector('#protected-content').hidden=false});
    </script>
  </body>
</html>
